services:

  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secret}
      POSTGRES_DB: discord_sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d discord_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-sentinel_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sentinel_redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Backend
  # ──────────────────────────────────────────────

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: sentinel-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@postgres:5432/discord_sentinel
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      API_KEY: ${API_KEY:-}
      VISION_MODEL_PATH: /models/vision/vision_sentinel.onnx
      TEXT_MODEL_PATH: /models/text/text_sentinel.onnx
      TEXT_TOKENIZER_PATH: /models/text/tokenizer.json
      TEXT_MAX_LENGTH: "256"
      RUST_LOG: info
    volumes:
      - ./ai/training/vision/exports:/models/vision:ro
      - ./ai/training/text/exports:/models/text:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: sentinel-gateway
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      REDIS_CHANNEL: sentinel:events
      API_KEY: ${API_KEY:-}
      HOST: 0.0.0.0
      PORT: "3001"
      MAX_CONNECTIONS: "1000"
      RUST_LOG: info
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: sentinel-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@postgres:5432/discord_sentinel
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Bots
  # ──────────────────────────────────────────────

  automod-bot:
    build:
      context: ./bots/automod-bot
      dockerfile: Dockerfile
    container_name: sentinel-automod-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${AUTOMOD_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  moderation-bot:
    build:
      context: ./bots/moderation-bot
      dockerfile: Dockerfile
    container_name: sentinel-moderation-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${MODERATION_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  security-bot:
    build:
      context: ./bots/security-bot
      dockerfile: Dockerfile
    container_name: sentinel-security-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${SECURITY_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  ticket-bot:
    build:
      context: ./bots/ticket-bot
      dockerfile: Dockerfile
    container_name: sentinel-ticket-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${TICKET_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  image-bot:
    build:
      context: ./bots/image-bot
      dockerfile: Dockerfile
    container_name: sentinel-image-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${IMAGE_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      MAX_IMAGE_SIZE: ${MAX_IMAGE_SIZE:-10485760}
      RUST_LOG: info
    depends_on:
      - api

  voice-bot:
    build:
      context: ./bots/voice-bot
      dockerfile: Dockerfile
    container_name: sentinel-voice-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${VOICE_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      GUILD_ID: ${VOICE_GUILD_ID}
      PUBLIC_CREATOR_CHANNEL_ID: ${VOICE_PUBLIC_CREATOR_CHANNEL_ID}
      PRIVATE_CREATOR_CHANNEL_ID: ${VOICE_PRIVATE_CREATOR_CHANNEL_ID}
      LOG_CHANNEL_ID: ${VOICE_LOG_CHANNEL_ID:-}
      RUST_LOG: info
    depends_on:
      - api

  stats-bot:
    build:
      context: ./bots/stats-bot
      dockerfile: Dockerfile
    container_name: sentinel-stats-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${STATS_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  audit-bot:
    build:
      context: ./bots/audit-bot
      dockerfile: Dockerfile
    container_name: sentinel-audit-bot
    restart: unless-stopped
    environment:
      AUDIT_DISCORD_TOKEN: ${AUDIT_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  roles-bot:
    build:
      context: ./bots/roles-bot
      dockerfile: Dockerfile
    container_name: sentinel-roles-bot
    restart: unless-stopped
    environment:
      ROLES_DISCORD_TOKEN: ${ROLES_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  # ──────────────────────────────────────────────
  # Monitoring
  # ──────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentinel-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sentinel.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - monitoring

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sentinel-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-sentinel_redis}
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
