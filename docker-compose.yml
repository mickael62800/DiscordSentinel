services:

  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secret}
      POSTGRES_DB: discord_sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d discord_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-sentinel_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sentinel_redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Backend
  # ──────────────────────────────────────────────

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: sentinel-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@postgres:5432/discord_sentinel
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: sentinel-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@postgres:5432/discord_sentinel
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Bots
  # ──────────────────────────────────────────────

  automod-bot:
    build:
      context: ./bots/automod-bot
      dockerfile: Dockerfile
    container_name: sentinel-automod-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${AUTOMOD_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  moderation-bot:
    build:
      context: ./bots/moderation-bot
      dockerfile: Dockerfile
    container_name: sentinel-moderation-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${MODERATION_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  security-bot:
    build:
      context: ./bots/security-bot
      dockerfile: Dockerfile
    container_name: sentinel-security-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${SECURITY_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  ticket-bot:
    build:
      context: ./bots/ticket-bot
      dockerfile: Dockerfile
    container_name: sentinel-ticket-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${TICKET_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  # ──────────────────────────────────────────────
  # Monitoring
  # ──────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentinel-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sentinel.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - monitoring

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sentinel-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-sentinel_redis}
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
