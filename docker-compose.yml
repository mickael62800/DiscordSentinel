services:

  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    # NOTE Phase 0 — observabilité : `shared_preload_libraries=pg_stat_statements`
    # est obligatoire pour identifier les queries lentes (cf. docs/BASELINE_METRICS.md).
    # Le `CREATE EXTENSION` correspondant est dans la migration `099_enable_pg_stat_statements.sql`.
    #
    # Phase 2 A.5 — Tuning RAM (cible serveur 16 GB) :
    #   - shared_buffers 4GB (25 % RAM, 5-50x sur queries read-heavy)
    #   - effective_cache_size 10GB (planificateur prefere index scans)
    #   - work_mem 64MB (sorts/joins 10-100x, budget 30 conn x 64MB x 2 = 3.8GB max)
    #   - maintenance_work_mem 1GB (VACUUM/REINDEX 5-10x)
    #   - WAL tuning : wal_buffers=16MB, max_wal_size=4GB pour lisser les checkpoints
    # Pour un serveur < 16 GB, diviser shared_buffers et effective_cache_size
    # par 2 ou 4 selon la RAM disponible.
    command: >-
      postgres
      -c max_connections=150
      -c shared_buffers=4GB
      -c effective_cache_size=10GB
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c max_wal_size=4GB
      -c min_wal_size=1GB
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secret}
      POSTGRES_DB: discord_sentinel
    # Port expose uniquement en localhost (dev). En prod, supprimer cette ligne.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d discord_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Phase 2 A.6 — PgBouncer en transaction pooling devant Postgres.
  # Multiplie x5-10 le nombre de clients simultanes sans fatiguer Postgres.
  # CAVEAT transaction pooling : pas de SET, LISTEN/NOTIFY ni advisory locks
  # session-scoped (le code actuel n'en utilise pas).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: sentinel-pgbouncer
    restart: unless-stopped
    environment:
      # Phase 7A opt C.1 : DATABASE_URL doit pointer sur **postgres** (upstream),
      # pas sur pgbouncer lui-meme. Bug pre-existant qui causait des boucles.
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@postgres:5432/discord_sentinel
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      # PgBouncer 1.21+ supporte les prepared statements en transaction pooling
      # via cette option. sqlx les utilise via son cache implicite, donc
      # critique pour ne pas casser l'API.
      MAX_PREPARED_STATEMENTS: 100
      SERVER_RESET_QUERY: DISCARD ALL
      ADMIN_USERS: sentinel
      AUTH_TYPE: scram-sha-256
    ports:
      - "127.0.0.1:6432:5432"
    # Phase 7A opt C.2 : pas de healthcheck CMD (edoburu/pgbouncer n'a ni nc
    # ni pg_isready). pgbouncer demarre en ~1s apres postgres healthy, donc
    # `condition: service_started` cote api est suffisant.
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    # Phase 2 A.5 — Tuning RAM Redis :
    #   - maxmemory 2gb : limite haute (hit rate cible > 85 %)
    #   - allkeys-lru : eviction LRU sur toutes les cles quand maxmemory atteint
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:-sentinel_redis}
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    # Port expose uniquement en localhost (dev). En prod, supprimer cette ligne.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sentinel_redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Backend
  # ──────────────────────────────────────────────

  api:
    # Phase 7A : context = racine du repo car services/api depend de
    # services/proto via path. Le Dockerfile a ete adapte en consequence.
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: sentinel-api
    restart: unless-stopped
    # Partage le namespace PID de l'host → /proc dans le conteneur refere
    # a l'host, ce qui permet a sysinfo de remonter le CPU/RAM reel de la
    # machine (pas du conteneur). Necessaire pour l'endpoint /api/system/info.
    pid: host
    ports:
      - "3000:3000"     # HTTP/Axum (legacy + endpoints non migres)
      - "50051:50051"   # Phase 7A : gRPC/tonic interne aux bots
    # Phase 7A opt B.2 : healthcheck gRPC via grpc_health_probe (tonic-health).
    # Verifie que le serveur tonic repond sur les 12 services simultanement.
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    environment:
      # Phase 7A opt C.1 : pgbouncer transaction pooling reactive.
      # Le fix sqlx statement_cache_capacity(0) cote main.rs resout les
      # query_wait_timeout. Pool sizing : 25 connexions par replica API
      # (cf. DEFAULT_POOL_SIZE du service pgbouncer).
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      API_KEY: ${API_KEY}
      REQUIRE_API_KEY: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      WEB_FRONT_URL: ${WEB_FRONT_URL:-}
      AUTOMOD_DISCORD_TOKEN: ${AUTOMOD_DISCORD_TOKEN}
      VISION_MODEL_PATH: /models/vision/vision_sentinel.onnx
      TEXT_MODEL_PATH: /models/text/text_sentinel.onnx
      TEXT_TOKENIZER_PATH: /models/text/tokenizer.json
      TEXT_MAX_LENGTH: "256"
      RUST_LOG: info
    volumes:
      - ./ai/training/vision/exports:/models/vision:ro
      - ./ai/training/text/exports:/models/text:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: sentinel-gateway
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      REDIS_CHANNEL: sentinel:events
      API_KEY: ${API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      HOST: 0.0.0.0
      PORT: "3001"
      MAX_CONNECTIONS: "1000"
      RUST_LOG: info
    depends_on:
      redis:
        condition: service_healthy

  moderation-worker:
    build:
      context: .
      dockerfile: services/workers/moderation-worker/Dockerfile
    container_name: sentinel-moderation-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      # Phase 4 B — Redis requis pour publier les events sanction_expiry_reminder
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      API_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-worker:
    build:
      context: .
      dockerfile: services/workers/analytics-worker/Dockerfile
    container_name: sentinel-analytics-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      API_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  monitoring-worker:
    build:
      context: .
      dockerfile: services/workers/monitoring-worker/Dockerfile
    container_name: sentinel-monitoring-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      API_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      MONITOR_CHECK_INTERVAL: ${MONITOR_CHECK_INTERVAL:-30}
      RUST_LOG: info
    depends_on:
      redis:
        condition: service_healthy

  cache-worker:
    build:
      context: .
      dockerfile: services/workers/cache-worker/Dockerfile
    container_name: sentinel-cache-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      API_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      ANALYTICS_CACHE_REFRESH: ${ANALYTICS_CACHE_REFRESH:-300}
      DASHBOARD_CACHE_REFRESH: ${DASHBOARD_CACHE_REFRESH:-600}
      VOICE_STATS_CACHE_REFRESH: ${VOICE_STATS_CACHE_REFRESH:-3600}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Phase 4 A — File d'attente IA async (depile ai_jobs et appelle l'inference API)
  ai-worker:
    build:
      context: .
      dockerfile: services/workers/ai-worker/Dockerfile
    container_name: sentinel-ai-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      API_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      AI_POLL_INTERVAL: ${AI_POLL_INTERVAL:-2}
      AI_JOB_TIMEOUT: ${AI_JOB_TIMEOUT:-120}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Phase 4 B — Purge des roles temporaires expires (extrait de community-bot)
  temp-roles-worker:
    build:
      context: .
      dockerfile: services/workers/temp-roles-worker/Dockerfile
    container_name: sentinel-temp-roles-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      API_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      TEMP_ROLES_SCAN_INTERVAL: ${TEMP_ROLES_SCAN_INTERVAL:-60}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Phase 6A — Escalade SLA des tickets d'appel de sanction
  appeal-sla-worker:
    build:
      context: .
      dockerfile: services/workers/appeal-sla-worker/Dockerfile
    container_name: sentinel-appeal-sla-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      API_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      APPEAL_SLA_SCAN_INTERVAL: ${APPEAL_SLA_SCAN_INTERVAL:-120}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Phase 6A — Exports asynchrones (CSV/JSON) infractions/audit_logs/moderation_actions
  export-worker:
    build:
      context: .
      dockerfile: services/workers/export-worker/Dockerfile
    container_name: sentinel-export-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      API_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      EXPORT_SCAN_INTERVAL: ${EXPORT_SCAN_INTERVAL:-5}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  # Phase 6A — Refresh du cache watched_users pour audit-bot (scaling horizontal)
  audit-cache-worker:
    build:
      context: .
      dockerfile: services/workers/audit-cache-worker/Dockerfile
    container_name: sentinel-audit-cache-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      API_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      AUDIT_CACHE_REFRESH_INTERVAL: ${AUDIT_CACHE_REFRESH_INTERVAL:-60}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Phase 6A — Cleanup des tables blackjack inactives (scaling horizontal)
  blackjack-cleanup-worker:
    build:
      context: .
      dockerfile: services/workers/blackjack-cleanup-worker/Dockerfile
    container_name: sentinel-blackjack-cleanup-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      API_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      BLACKJACK_CLEANUP_SCAN_INTERVAL: ${BLACKJACK_CLEANUP_SCAN_INTERVAL:-60}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Phase 6A — Reconciliation audit_logs avec l'API Discord audit-logs
  discord-audit-sync-worker:
    build:
      context: .
      dockerfile: services/workers/discord-audit-sync-worker/Dockerfile
    container_name: sentinel-discord-audit-sync-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      API_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      # Reutilise le token moderation-bot (doit avoir VIEW_AUDIT_LOG sur toutes
      # les guilds a sync)
      MODERATION_DISCORD_TOKEN: ${MODERATION_DISCORD_TOKEN:-}
      AUDIT_SYNC_INTERVAL: ${AUDIT_SYNC_INTERVAL:-300}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  cleanup-worker:
    build:
      context: .
      dockerfile: services/workers/cleanup-worker/Dockerfile
    container_name: sentinel-cleanup-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      API_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      VOICE_SESSIONS_RETENTION_DAYS: ${VOICE_SESSIONS_RETENTION_DAYS:-90}
      LOGS_RETENTION_DAYS: ${LOGS_RETENTION_DAYS:-30}
      CLOSED_TICKETS_RETENTION_DAYS: ${CLOSED_TICKETS_RETENTION_DAYS:-180}
      CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-1}
      VACUUM_ENABLED: ${VACUUM_ENABLED:-true}
      VACUUM_INTERVAL_HOURS: ${VACUUM_INTERVAL_HOURS:-24}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # AI
  # ──────────────────────────────────────────────

  ai-api:
    build:
      context: .
      dockerfile: ai/api/Dockerfile
    container_name: sentinel-ai-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AI_API_PORT: "8000"
    volumes:
      - ./ai/training:/app/training
    profiles:
      - ai

  # ──────────────────────────────────────────────
  # Bots
  # ──────────────────────────────────────────────
  #
  # Phase 7 C — Sharding Discord
  # ─────────────────────────────
  # Par defaut chaque bot utilise SHARD_MODE=single (non defini), ce qui
  # correspond a `client.start()` historique. Trois modes disponibles via
  # env var `SHARD_MODE` :
  #
  #   single  (defaut) : un seul shard (shard 0/1). OK jusqu'a ~2500 guilds.
  #
  #   auto             : Serenity appelle /gateway/bot Discord pour recuperer
  #                      le nombre de shards recommande et spawn tous les
  #                      shards dans le process courant.
  #                      -> Recommande pour single-process a gros volume.
  #
  #   manual           : `client.start_shard(SHARD_ID, SHARD_TOTAL)` — spawn
  #                      UN seul shard avec les id/total explicites.
  #                      -> Requis pour multi-process (replicas).
  #                      -> Chaque replica doit avoir SHARD_ID different.
  #
  # Exemple manual pour scaler moderation-bot en 4 replicas (docker-compose
  # n'a pas de primitive "replicas with env override", mais on peut faire
  # 4 services moderation-bot-0..3 qui partagent le meme Dockerfile et
  # juste differencient SHARD_ID).

  automod-bot:
    build:
      context: .
      dockerfile: bots/automod-bot/Dockerfile
    container_name: sentinel-automod-bot
    restart: unless-stopped
    environment:
      AUTOMOD_DISCORD_TOKEN: ${AUTOMOD_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      GRPC_API_URL: http://api:50051   # Phase 7A : full gRPC (AnalyzeMessage hot path)
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  moderation-bot:
    build:
      context: .
      dockerfile: bots/moderation-bot/Dockerfile
    container_name: sentinel-moderation-bot
    restart: unless-stopped
    environment:
      MODERATION_DISCORD_TOKEN: ${MODERATION_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      GRPC_API_URL: http://api:50051   # Phase 7A : partiel (LogAction + GetHistory)
      API_KEY: ${API_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      REDIS_CHANNEL: sentinel:events
      RUST_LOG: info
    depends_on:
      - api

  security-bot:
    build:
      context: .
      dockerfile: bots/security-bot/Dockerfile
    container_name: sentinel-security-bot
    restart: unless-stopped
    environment:
      SECURITY_DISCORD_TOKEN: ${SECURITY_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      GRPC_API_URL: http://api:50051   # Phase 7A : full (Security + Members)
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  ticket-bot:
    build:
      context: .
      dockerfile: bots/ticket-bot/Dockerfile
    container_name: sentinel-ticket-bot
    restart: unless-stopped
    environment:
      TICKET_DISCORD_TOKEN: ${TICKET_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      GRPC_API_URL: http://api:50051   # Phase 7A : full TicketsService
      API_KEY: ${API_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      REDIS_CHANNEL: sentinel:events
      RUST_LOG: info
    depends_on:
      - api

  image-bot:
    build:
      context: .
      dockerfile: bots/image-bot/Dockerfile
    container_name: sentinel-image-bot
    restart: unless-stopped
    environment:
      IMAGE_DISCORD_TOKEN: ${IMAGE_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      GRPC_API_URL: http://api:50051   # Phase 7A : full ImagesService (bytes natifs)
      API_KEY: ${API_KEY:-}
      MAX_IMAGE_SIZE: ${MAX_IMAGE_SIZE:-10485760}
      RUST_LOG: info
    depends_on:
      - api

  voice-bot:
    build:
      context: .
      dockerfile: bots/voice-bot/Dockerfile
    container_name: sentinel-voice-bot
    restart: unless-stopped
    environment:
      VOICE_DISCORD_TOKEN: ${VOICE_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      GRPC_API_URL: http://api:50051   # Phase 7A : full VoiceChannels + Moderation
      API_KEY: ${API_KEY:-}
      VOICE_GUILD_ID: ${VOICE_GUILD_ID}
      VOICE_PUBLIC_CREATOR_CHANNEL_ID: ${VOICE_PUBLIC_CREATOR_CHANNEL_ID}
      VOICE_PRIVATE_CREATOR_CHANNEL_ID: ${VOICE_PRIVATE_CREATOR_CHANNEL_ID}
      VOICE_LOG_CHANNEL_ID: ${VOICE_LOG_CHANNEL_ID:-}
      RUST_LOG: info
    depends_on:
      - api

  progression-bot:
    build:
      context: .
      dockerfile: bots/progression-bot/Dockerfile
    container_name: sentinel-progression-bot
    restart: unless-stopped
    environment:
      PROGRESSION_DISCORD_TOKEN: ${PROGRESSION_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      GRPC_API_URL: http://api:50051   # Phase 7A : full Progression + Stats
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  audit-bot:
    build:
      context: .
      dockerfile: bots/audit-bot/Dockerfile
    container_name: sentinel-audit-bot
    restart: unless-stopped
    environment:
      AUDIT_DISCORD_TOKEN: ${AUDIT_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  community-bot:
    build:
      context: .
      dockerfile: bots/community-bot/Dockerfile
    container_name: sentinel-community-bot
    restart: unless-stopped
    environment:
      COMMUNITY_DISCORD_TOKEN: ${COMMUNITY_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      GRPC_API_URL: http://api:50051   # Phase 7A : partiel RolePanelsService
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  roles-bot:
    build:
      context: .
      dockerfile: bots/roles-bot/Dockerfile
    container_name: sentinel-roles-bot
    restart: unless-stopped
    environment:
      ROLES_DISCORD_TOKEN: ${ROLES_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      GRPC_API_URL: http://api:50051   # Phase 7A : partiel RolePanelsService
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  cleanup-bot:
    build:
      context: .
      dockerfile: bots/cleanup-bot/Dockerfile
    container_name: sentinel-cleanup-bot
    restart: unless-stopped
    environment:
      CLEANUP_DISCORD_TOKEN: ${CLEANUP_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  blackjack-bot:
    build:
      context: .
      dockerfile: bots/blackjack-bot/Dockerfile
    container_name: sentinel-blackjack-bot
    restart: unless-stopped
    environment:
      BLACKJACK_DISCORD_TOKEN: ${BLACKJACK_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      GRPC_API_URL: http://api:50051   # Phase 7A : full BlackjackService (solo + wallet)
      API_KEY: ${API_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      RUST_LOG: info
    depends_on:
      - api
      - redis

  coude-bot:
    build:
      context: .
      dockerfile: bots/coude-bot/Dockerfile
    container_name: sentinel-coude-bot
    restart: unless-stopped
    environment:
      COUDE_DISCORD_TOKEN: ${COUDE_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      GRPC_API_URL: http://api:50051   # Phase 7A : partiel CoudePlayerService
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  game-bot:
    build:
      context: .
      dockerfile: bots/game-bot/Dockerfile
    container_name: sentinel-game-bot
    restart: unless-stopped
    environment:
      GAME_DISCORD_TOKEN: ${GAME_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  welcome-bot:
    build:
      context: .
      dockerfile: bots/welcome-bot/Dockerfile
    container_name: sentinel-welcome-bot
    restart: unless-stopped
    environment:
      WELCOME_DISCORD_TOKEN: ${WELCOME_DISCORD_TOKEN}
      API_BASE_URL: http://api:3000
      GRPC_API_URL: http://api:50051   # Phase 7A : partiel MembersService.GetMember
      API_KEY: ${API_KEY:-}
      RUST_LOG: info
    depends_on:
      - api

  coude-worker:
    build:
      context: .
      dockerfile: services/workers/coude-worker/Dockerfile
    container_name: sentinel-coude-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      API_URL: http://api:3000
      API_KEY: ${API_KEY:-}
      COMBAT_EXPIRY_CHECK_SECS: ${COMBAT_EXPIRY_CHECK_SECS:-86400}
      BETTING_CHECK_SECS: ${BETTING_CHECK_SECS:-30}
      COUDE_DISCORD_TOKEN: ${COUDE_DISCORD_TOKEN}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Monitoring
  # ──────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentinel-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sentinel.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - monitoring

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sentinel-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-sentinel_redis}
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - monitoring

  # Phase 0 — Observabilité : Prometheus + Grafana
  # Démarrage : `docker compose --profile monitoring up -d prometheus grafana`
  # Cible Prometheus → API (port 3000) + workers (port 9100 chacun)
  # Grafana → http://localhost:3001 (admin/admin par défaut, à changer)
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
