[package]
name = "voice-bot"
version = "0.1.0"
edition = "2021"
description = "Bot de gestion de salons vocaux temporaires — public, prive, whitelist, co-admin, vote kick"

[dependencies]
sentinel-shared = { workspace = true }
sentinel-proto = { workspace = true }
tonic = { workspace = true }
serenity = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }

# Phase 1 — Quick wins : jemalloc en allocateur global (Linux/macOS uniquement,
# pas supporte sur MSVC Windows). Gain typique : -15 % RAM residente sur les
# processus long-running grace a une meilleure gestion de la fragmentation.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[lints]
workspace = true
