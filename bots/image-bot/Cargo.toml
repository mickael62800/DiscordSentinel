[package]
name = "image-bot"
version = "0.1.0"
edition = "2021"
description = "Bot Discord de detection d'images NSFW et produits illicites - Forward vers API pour inference ONNX"

[dependencies]
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
time = "0.3"
tracing-subscriber = "0.3"
dashmap = "6"
base64 = "0.22"
