[package]
name = "security-bot"
version = "0.1.0"
edition = "2021"
description = "Bot de sécurité Discord — anti-raid, vérification utilisateurs, protection serveur"

[dependencies]
sentinel-shared = { path = "../shared" }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "5"
chrono = { version = "0.4", features = ["serde"] }
