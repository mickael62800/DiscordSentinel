[package]
name = "game-bot"
version = "0.1.0"
edition = "2021"
description = "Bot Discord de gestion des jeux — inscription et notification par #NomDuJeu"

[dependencies]
sentinel-shared = { path = "../shared" }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
