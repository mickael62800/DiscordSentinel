[package]
name = "ticket-bot"
version = "0.1.0"
edition = "2021"
description = "Bot de gestion de tickets Discord — support utilisateur, signalements"

[dependencies]
sentinel-shared = { path = "../shared" }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "5"
