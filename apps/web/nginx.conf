# Reverse-proxy + SPA static server pour apps/web (Vue 3 + Vite).
# - Port 80  : sert les challenges ACME (/.well-known/acme-challenge/) puis
#              redirige tout le reste vers HTTPS.
# - Port 443 : TLS + reverse-proxy /api/* -> api:3000, /ws -> gateway:3001.

# Buffers augmentes : exports CSV/JSON de l'API peuvent etre volumineux.
client_max_body_size 25m;

# Resolver Docker DNS embarque (127.0.0.11). Indispensable pour que nginx
# re-resolve les hostnames `api` et `gateway` apres un rebuild Docker
# (sinon il garde l'ancienne IP en cache et bug en 502 a chaque deploy).
# valid=10s : duree max du cache DNS. ipv6=off : on n'utilise que IPv4
# entre containers.
resolver 127.0.0.11 valid=10s ipv6=off;

# ──────────────────────────────────────────────────────────────
# HTTP : ACME challenge + redirect 301 vers HTTPS
# ──────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    # Challenge HTTP-01 de certbot : doit rester accessible en HTTP sans
    # redirection (sinon LE ne peut pas valider le domaine).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Healthcheck en HTTP (pour l'orchestrateur) : 200 sans TLS.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Tout le reste -> HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────────────────────────────────────────────────────
# HTTPS : TLS + SPA + reverse-proxy
# ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certs geres par l'entrypoint (Let's Encrypt ou self-signed fallback).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS moderne (Mozilla "intermediate", drop TLS 1.0/1.1).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP : script-src 'self' uniquement (no unsafe-inline) -> empeche
    # l'execution de tout script injecte (defense XSS forte). Vite est
    # configure avec modulePreload.polyfill=false pour ne PAS generer
    # de scripts inline dans index.html.
    # style-src garde 'unsafe-inline' car Vue + chart.js generent du style
    # dynamique (ex: Element.style, transitions calculees). Le risque XSS
    # via style-src est tres faible vs script-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip : texte uniquement.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Sert les .gz pre-compresses si presents (genere a la build par
    # vite-plugin-compression2 ou equivalent). Economise du CPU nginx vs
    # compression a la volee.
    gzip_static on;

    # Assets Vite hashes : cache long (1 an, immutable).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy API Axum. Le prefixe /api/ est conserve.
    # NB: l'usage d'une variable dans proxy_pass force nginx a re-resoudre
    # le hostname `api` au runtime via le resolver Docker (127.0.0.11) au
    # lieu de cacher l'IP au boot. Indispensable apres un rebuild de l'API.
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # OAuth Discord : /auth/discord/authorize et /auth/discord/callback
    # sont des endpoints API (pas des routes SPA). Sans ce proxy, nginx
    # sert index.html via le fallback et le login Discord ne demarre jamais.
    # ATTENTION : /auth/callback (sans /discord/) est une route SPA Vue qui
    # parse le hash fragment apres OAuth -> pas de proxy dessus.
    location /auth/discord/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Reverse-proxy WebSocket gateway. Upgrade headers obligatoires.
    location /ws {
        set $gateway_upstream http://gateway:3001;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS peut rester ouvert longtemps : timeout relatif au heartbeat client.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback : toute route inconnue renvoie index.html pour vue-router.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html sans cache => deploiements propages immediatement.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
