syntax = "proto3";

package sentinel.bump.v1;

// Service bump : recompenses de /bump (Disboard, DiscordL, …). Le bot detecte
// un bump reussi ; l'API applique le cooldown atomique, la recompense graduee
// et le seuil VIP, puis pousse les rappels de re-disponibilite. Wrappe
// `ManageBumpUseCase`.
service BumpService {
  // Enregistre un bump constate par le bot (cooldown + recompense + VIP).
  rpc RecordBump(RecordBumpRequest) returns (BumpReward);
  // Rappels dus (cooldown ecoule, rappel non envoye) — poll par le bot.
  rpc DueReminders(DueRemindersRequest) returns (DueReminderList);
  // Marque le rappel envoye (par provider ; absent = tous, retrocompat).
  rpc MarkReminderSent(MarkReminderSentRequest) returns (MarkReminderSentResponse);
  // Etat par provider d'une guild (carte de statut : dispo / en cooldown).
  rpc GuildStatus(GuildStatusRequest) returns (BumpStatusList);
}

message RecordBumpRequest {
  string guild_id = 1;
  string user_id = 2;
  string username = 3;
  // Salon ou le bot a poste (fallback si bump_channel_id non configure).
  string channel_id = 4;
  // "disboard" | "discordl" | ... (normalise cote serveur).
  string provider = 5;
}

message BumpReward {
  bool rewarded = 1;
  int64 reward = 2;
  int64 weekly_count = 3;
  optional int64 new_balance = 4;
  // Role VIP a poser (le bot fait l'ajout Discord, idempotent).
  optional string vip_role_id = 5;
  // true uniquement au bump qui FRANCHIT le seuil (annonce unique).
  bool vip_just_unlocked = 6;
}

message DueRemindersRequest {}

message DueReminder {
  string guild_id = 1;
  string channel_id = 2;
  string provider = 3;
}

message DueReminderList {
  repeated DueReminder reminders = 1;
}

message MarkReminderSentRequest {
  string guild_id = 1;
  // Absent => tous les providers (retrocompat).
  optional string provider = 2;
}

message MarkReminderSentResponse {}

message GuildStatusRequest {
  string guild_id = 1;
}

message BumpStatus {
  string provider = 1;
  string channel_id = 2;
  // RFC3339.
  string last_bump_at = 3;
  int64 cooldown_minutes = 4;
  // Instant de re-disponibilite (last_bump_at + cooldown), calcule cote serveur.
  string ready_at = 5;
}

message BumpStatusList {
  repeated BumpStatus statuses = 1;
}
