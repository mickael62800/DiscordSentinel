syntax = "proto3";

package sentinel.moderation.v1;

// Service moderation v1 : log d'actions et historique utilisateur.
//
// Scope volontairement reduit pour ce premier portage : seul le hot path
// (`LogAction` appele a chaque ban/mute/warn) et `GetHistory` (consultation
// frequente) sont migres. Les endpoints evidence / review / modstats /
// pending utilisent des repos directs sans use-case unifie cote API
// (`ManageModerationUseCase` n'expose que ces 2 methodes utiles ici) — ils
// seront ajoutes en v2 quand le domaine sera consolide.
service ModerationService {
  rpc LogAction(LogActionRequest) returns (ModerationAction);
  rpc GetHistory(GetHistoryRequest) returns (UserHistory);
  // Copilote de moderation (lecture seule, consultatif) : contexte d'un membre
  // et suggestion de sanction proportionnee. Chemin bot/interne de confiance ;
  // le bot verifie la permission de moderation Discord avant d'appeler.
  rpc GetMemberContext(GetMemberContextRequest) returns (MemberModerationContext);
}

message LogActionRequest {
  string guild_id = 1;
  string channel_id = 2;
  string moderator_id = 3;
  string moderator_name = 4;
  string target_id = 5;
  string target_name = 6;
  string action_type = 7;
  string reason = 8;
  // "low" | "medium" | "high" | "critical"
  optional string gravity = 9;
  // Duree en secondes (None = permanent)
  optional uint64 duration = 10;
  // Si true : journalise l'action SANS incrementer de strike. Utilise pour
  // les sanctions d'escalade auto (declenchees par un strike deja compte) afin
  // d'eviter une boucle de double-strike.
  bool skip_strike = 11;
}

message GetHistoryRequest {
  string guild_id = 1;
  string user_id = 2;
}

message ModerationAction {
  string id = 1;
  string guild_id = 2;
  string channel_id = 3;
  string moderator_id = 4;
  string moderator_name = 5;
  string target_id = 6;
  string target_name = 7;
  string action_type = 8;
  string reason = 9;
  optional string gravity = 10;
  optional uint64 duration = 11;
  // RFC3339
  string created_at = 12;
  // Renseignes uniquement en reponse de LogAction (None dans GetHistory).
  // Nombre de strikes actifs pour le user apres cette action.
  optional uint32 strikes_count = 13;
  // Action d'escalation declenchee par le seuil de strikes (mute, ban, ...).
  optional string escalation_action = 14;
  // Duree de l'escalation en secondes (None = permanent).
  optional uint64 escalation_duration = 15;
}

message UserHistory {
  string target_id = 1;
  string target_name = 2;
  uint32 total_warns = 3;
  uint32 total_mutes = 4;
  uint32 total_bans = 5;
  repeated ModerationAction actions = 6;
}

// ── Copilote de moderation ──

message GetMemberContextRequest {
  string guild_id = 1;
  string user_id = 2;
  // Fenetre d'agregation en jours (defaut 90, borne 1..=365 cote service).
  int64 lookback_days = 3;
  // Nombre minimal de precedents pour suivre la jurisprudence (defaut 3).
  uint32 min_precedents = 4;
}

// Compte d'une action (sanction par type OU precedent par action retenue).
message ActionCount {
  string action = 1;
  uint32 count = 2;
}

// Distribution des precedents (jurisprudence) pour la categorie dominante.
message PrecedentDistribution {
  string flag_category = 1;
  repeated ActionCount counts_by_action = 2;
  uint32 total = 3;
}

// Suggestion de sanction consultative + explication (POURQUOI).
message SanctionSuggestion {
  // Action suggeree (`warn`|`mute`|`ban`|...) ou absente si base insuffisante.
  optional string action = 1;
  // Fondement : "escalation" | "precedent" | "both" | "insufficient".
  string basis = 2;
  string rationale = 3;
  uint32 precedent_count = 4;
}

message MemberModerationContext {
  uint32 active_strikes = 1;
  repeated ActionCount sanctions_by_type = 2;
  // RFC3339, absent si aucune sanction.
  optional string last_sanction_at = 3;
  uint32 open_reviews = 4;
  PrecedentDistribution precedents = 5;
  SanctionSuggestion suggestion = 6;
}
