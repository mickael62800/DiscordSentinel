syntax = "proto3";

package sentinel.automod.v1;

// Service automod : analyse de messages en temps reel.
//
// **Hot path le plus chaud du projet** — appele a chaque message Discord
// par automod-bot. Le gain perf gRPC est ici maximal : protobuf binaire
// au lieu de JSON, multiplexage HTTP/2, contrat type strict.
service AutomodService {
  rpc AnalyzeMessage(AnalyzeMessageRequest) returns (AnalyzeMessageResponse);
}

message DetectionFlags {
  bool spam = 1;
  bool insult = 2;
  bool link = 3;
  bool phishing = 4;
}

message ContextMessage {
  string username = 1;
  string content = 2;
}

message AnalyzeMessageRequest {
  string guild_id = 1;
  string channel_id = 2;
  string user_id = 3;
  string username = 4;
  string content = 5;
  DetectionFlags flags = 6;
  string message_id = 7;
  // RFC3339
  string timestamp = 8;
  // Messages precedents pour l'analyse de sentiment.
  repeated ContextMessage context_messages = 9;
}

// Action a appliquer cote bot. Identique a `Action` du domain.
enum Action {
  ACTION_NONE = 0;
  ACTION_WARN = 1;
  ACTION_DELETE = 2;
  ACTION_MUTE = 3;
  ACTION_BAN = 4;
}

// Decision de routage calculee COTE SERVEUR (l'API connait la config guild).
// Le bot se contente d'executer : plus de logique de routage dupliquee.
enum Routing {
  // Ne rien faire automatiquement (ex. human_only sans salon de review).
  ROUTING_NONE = 0;
  // Poster une carte de review/vote dans le salon de logs.
  ROUTING_CARD = 1;
  // Appliquer directement l'action (mode auto, hors human_only).
  ROUTING_AUTO = 2;
}

message AnalyzeMessageResponse {
  Action action = 1;
  string reason = 2;
  double score = 3;
  optional uint64 duration = 4;

  // ── Decision de routage (calculee cote serveur) ──
  // Que doit faire le bot de cette detection.
  Routing route = 5;
  // Cas severe (phishing / invitation Discord) : le bot applique une
  // protection reversible immediate (mute + suppression) en plus de la carte.
  bool severe = 6;
  // Lien non autorise HORS image : suppression automatique immediate.
  bool auto_delete_link = 7;
}
