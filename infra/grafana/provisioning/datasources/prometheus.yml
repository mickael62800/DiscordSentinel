# Provisioning automatique de la datasource Prometheus pour Grafana.
# Lu au démarrage du conteneur, pas besoin de cliquer dans l'UI.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
