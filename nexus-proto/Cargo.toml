[package]
name = "nexus-proto"
version = "0.1.0"
edition = "2021"
description = "Définitions protobuf/gRPC de la plateforme jeux Nexus"

[lib]
name = "nexus_proto"
path = "src/lib.rs"

[dependencies]
tonic = { workspace = true }
prost = { workspace = true }

[build-dependencies]
tonic-build = { version = "0.13", default-features = false, features = ["prost", "transport"] }
protoc-bin-vendored = "3.1"

[lints]
workspace = true
