[advisories]
yanked = "warn"
ignore = [
    # serenity 0.12.5 pin tungstenite 0.21 -> rustls 0.22 -> rustls-webpki 0.102.8.
    # Surface : WebSocket sortante vers gateway.discord.gg (cible connue, pas de CRL custom).
    # Resolution : attendre serenity 0.13 (rustls 0.23+).
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # rsa 0.9 (Marvin timing sidechannel) tire par sqlx-mysql.
    # Feature mysql jamais activee (postgres uniquement) -> code mort dans nos binaires.
    "RUSTSEC-2023-0071",
    # paste 1.0.15 unmaintained (warning, pas vulnerabilite).
    # Tire par tokenizers (ai-worker ONNX) - pas de remplacant upstream.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "allow"
wildcards = "warn"

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0",
    "MPL-2.0", "Zlib", "CC0-1.0", "Unlicense", "0BSD",
    "OpenSSL",
]
confidence-threshold = 0.8
