[package]
name = "sentinel-proto"
version = "0.1.0"
edition = "2021"
description = "Definitions protobuf partagees entre l'API et les bots Sentinel (gRPC interne)"

[lib]
name = "sentinel_proto"
path = "src/lib.rs"

[dependencies]
tonic = { version = "0.13", features = ["transport", "codegen", "prost", "server", "router", "tls-ring"] }
prost = "0.13"

[build-dependencies]
tonic-build = { version = "0.13", default-features = false, features = ["prost", "transport"] }
protoc-bin-vendored = "3.1"
