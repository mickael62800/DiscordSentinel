syntax = "proto3";

package sentinel.blackjack.v1;

// Service blackjack v1 : partie solo (start/hit/stand/double/active) + wallet.
// Les tables multijoueur restent en HTTP pour cette iteration.
service BlackjackService {
  rpc StartGame(StartGameRequest) returns (BlackjackGame);
  rpc Hit(GameIdRequest) returns (BlackjackGame);
  rpc Stand(GameIdRequest) returns (BlackjackGame);
  rpc DoubleDown(GameIdRequest) returns (BlackjackGame);
  rpc GetActive(GetActiveRequest) returns (GetActiveResponse);
  rpc GetWallet(GetWalletRequest) returns (Wallet);
}

message StartGameRequest {
  string guild_id = 1;
  string user_id = 2;
  string username = 3;
  int64 bet = 4;
}

message GameIdRequest {
  string game_id = 1;
}

message GetActiveRequest {
  string guild_id = 1;
  string user_id = 2;
}

message GetActiveResponse {
  optional BlackjackGame game = 1;
}

message GetWalletRequest {
  string guild_id = 1;
  string user_id = 2;
}

message Card {
  string rank = 1;
  string suit = 2;
  string filename = 3;
}

message BlackjackGame {
  string id = 1;
  string guild_id = 2;
  string user_id = 3;
  string username = 4;
  int64 bet = 5;
  repeated Card player_hand = 6;
  repeated Card dealer_hand = 7;
  string status = 8;
  int32 player_score = 9;
  int32 dealer_score = 10;
  bool doubled = 11;
  int64 payout = 12;
  // RFC3339
  string created_at = 13;
  optional string finished_at = 14;
}

message Wallet {
  string id = 1;
  string guild_id = 2;
  string user_id = 3;
  string username = 4;
  int64 coins = 5;
  int64 total_earned = 6;
  int64 total_spent = 7;
}
