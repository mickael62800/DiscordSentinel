[package]
name = "sentinel-gateway"
version = "0.1.0"
edition = "2021"
description = "Gateway WebSocket dediee — relay temps reel entre l'API et les clients (desktop app, bots)"

[dependencies]
# Web / WebSocket
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "propagate-header"] }

# Redis pub/sub
redis = { version = "0.27", features = ["tokio-comp"] }

# HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
dotenvy = "0.15"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"

# Shared worker infra (shutdown_signal)
sentinel-worker-common = { path = "../workers/worker-common" }
