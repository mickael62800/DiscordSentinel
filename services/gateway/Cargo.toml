[package]
name = "sentinel-gateway"
version = "0.1.0"
edition = "2021"
description = "Gateway WebSocket dediee — relay temps reel entre l'API et les clients (desktop app, bots)"

[dependencies]
# Web / WebSocket
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "propagate-header"] }

# Redis pub/sub
redis = { version = "0.27", features = ["tokio-comp"] }

# HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
dotenvy = "0.15"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"

# Shared worker infra (shutdown_signal)
sentinel-worker-common = { path = "../workers/worker-common" }

# Phase 1 — Quick wins : jemalloc en allocateur global (Linux/macOS uniquement,
# pas supporte sur MSVC Windows). Gain typique : -15 % RAM residente sur les
# processus long-running grace a une meilleure gestion de la fragmentation.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

# Phase 1 — Quick wins : profil release optimise pour la production.
# - lto = "fat" : optimisation cross-crate complete (-10 % binaire, -5/10 % CPU)
# - codegen-units = 1 : permet a LTO d'etre maximalement efficace
# - strip = true : retire les symboles de debug du binaire final
#
# On garde panic = "unwind" (defaut) pour isoler les paniques par tache tokio
# et eviter qu'une seule tache panique fasse crasher tout le process.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
