[package]
name = "sentinel-api"
version = "0.1.0"
edition = "2021"
description = "Backend API de DiscordSentinel — le cerveau de la modération"

[[bin]]
name = "sentinel-api"
path = "src/main.rs"

[lib]
name = "sentinel_api"
path = "src/lib.rs"

[dependencies]
# Web
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["limit", "load-shed"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "request-id", "propagate-header", "set-header", "compression-zstd", "compression-gzip"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }

# Cache
redis = { version = "0.27", features = ["tokio-comp"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
tokio-metrics = { version = "0.4", default-features = false, features = ["rt"] }

# AI / Inference ONNX
ort = "2.0.0-rc.12"
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
base64 = "0.22"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
dotenvy = "0.15"
futures-util = "0.3"
rand = "0.8"

[dev-dependencies]
http-body-util = "0.1"

# Phase 1 — Quick wins : jemalloc comme allocateur global (Linux/macOS uniquement,
# pas supporté sur MSVC Windows). Gain typique : -15 % RAM résidente sur API
# long-running grâce à une meilleure gestion de la fragmentation.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

# Phase 1 — Quick wins : profil release optimisé pour la production.
# - lto = "fat" : optimisation cross-crate complète (-10 % binaire, -5/10 % CPU)
# - codegen-units = 1 : permet à LTO d'être maximalement efficace
# - strip = true : retire les symboles de debug du binaire final
#
# ⚠️ On garde `panic = "unwind"` (défaut) — `abort` économiserait ~5 % du binaire
# mais ferait crasher tout le process si une seule tâche tokio panique, alors
# qu'unwind isole la panique au niveau de la tâche.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
