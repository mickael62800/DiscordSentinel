[package]
name = "sentinel-worker-common"
version = "0.1.0"
edition = "2021"
description = "Infrastructure partagee entre les workers DiscordSentinel"

[dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true }
sentinel-proto = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }

# Phase 0 — Observabilité : tokio-metrics + Prometheus exporter pour exposer
# les métriques runtime des workers (saturation, busy ratio, IO drivers, etc.).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
tokio-metrics = { version = "0.4", default-features = false, features = ["rt"] }
axum = "0.8"
