[package]
name = "sentinel-worker"
version = "0.1.0"
edition = "2021"
description = "Worker unifie DiscordSentinel — orchestrateur de tous les jobs periodiques (cleanup, coude, moderation, analytics, etc.) dans un seul binaire. Fusion progressive des anciens workers eclates."

[dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sentinel-worker-common = { path = "../worker-common" }
sentinel-proto = { path = "../../proto" }
tonic = { workspace = true }
rand = { workspace = true }

# jemalloc en allocateur global (Linux/macOS uniquement).
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"
