[package]
name = "sentinel-audit-cache-worker"
version = "0.1.0"
edition = "2021"
description = "Worker DiscordSentinel — refresh du cache watched_users pour audit-bot (Phase 6 A)"

[dependencies]
tokio = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }
reqwest = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
sentinel-worker-common = { path = "../worker-common" }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"
