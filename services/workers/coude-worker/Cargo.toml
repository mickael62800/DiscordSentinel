[package]
name = "sentinel-coude-worker"
version = "0.1.0"
edition = "2021"
description = "Worker Coup de Coude DiscordSentinel — expiration des combats en attente"

[dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
tonic = { workspace = true }
sentinel-proto = { workspace = true }
sentinel-worker-common = { path = "../worker-common" }

# Phase 1 — Quick wins : jemalloc en allocateur global (Linux/macOS uniquement,
# pas supporte sur MSVC Windows). Gain typique : -15 % RAM residente sur les
# processus long-running grace a une meilleure gestion de la fragmentation.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[lints]
workspace = true
