[package]
name = "sentinel-cleanup-worker"
version = "0.1.0"
edition = "2021"
description = "Worker cleanup DiscordSentinel — nettoyage automatique des anciennes donnees"

[dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
sentinel-worker-common = { path = "../worker-common" }

# Phase 1 — Quick wins : jemalloc en allocateur global (Linux/macOS uniquement,
# pas supporte sur MSVC Windows). Gain typique : -15 % RAM residente sur les
# processus long-running grace a une meilleure gestion de la fragmentation.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"
